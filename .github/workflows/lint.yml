name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash -n on shell scripts
        run: |
          set -e
          shopt -s nullglob
          files=( *.sh ssh-wrapper )
          echo "Checking: ${files[*]}"
          for f in "${files[@]}"; do
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck on shell scripts
        run: |
          set -e
          shopt -s nullglob
          files=( *.sh ssh-wrapper )
          echo "Checking: ${files[*]}"
          shellcheck -x "${files[@]}"
