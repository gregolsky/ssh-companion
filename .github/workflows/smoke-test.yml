name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run smoke test
        run: bash test/smoke-test.sh
