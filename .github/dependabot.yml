# Dependabot watches the base image (Dockerfile FROM) and GitHub Actions
# versions, opening PRs when updates are available. The mcp[cli] pip
# dependency is declared inline in the Dockerfile's RUN pip install, which
# Dependabot cannot track — Trivy's image scan covers CVEs there.

version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
